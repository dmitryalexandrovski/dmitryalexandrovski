<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 160" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="footerBg" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="50%" stop-color="#080F20" />
      <stop offset="100%" stop-color="#020B1A" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="footerWave1" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.75" />
      <stop offset="50%" stop-color="#0052CC" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.7" />
    </linearGradient>

    <linearGradient id="footerWave2" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" stop-opacity="0.3" />
      <stop offset="50%" stop-color="#0052CC" stop-opacity="0.4" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glow Filter -->
    <filter id="glowF" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="5" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulsePulse {
      0%, 100% { opacity: 0.4; }
      50% { opacity: 1; }
    }
    @keyframes ecgFooter {
      0% { stroke-dashoffset: 1600; }
      100% { stroke-dashoffset: 0; }
    }
    .ecg-footer {
      stroke-dasharray: 1600;
      stroke-dashoffset: 1600;
      animation: ecgFooter 7s linear infinite;
    }
  </style>

  <!-- Base Canvas -->
  <rect width="1200" height="160" rx="14" fill="url(#footerBg)" stroke="#30363D" stroke-width="1.2" />

  <!-- Cyber Wave Shapes -->
  <path d="M 0,55 Q 300,10 600,60 T 1200,35 L 1200,160 L 0,160 Z" fill="url(#footerWave1)" />
  <path d="M 0,75 Q 350,30 700,80 T 1200,55 L 1200,160 L 0,160 Z" fill="url(#footerWave2)" />

  <!-- Neon Pulse Line -->
  <path class="ecg-footer" 
        d="M 0,45 L 420,45 L 435,30 L 445,65 L 460,15 L 475,80 L 488,35 L 500,45 L 1200,45" 
        fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" filter="url(#glowF)" />

  <!-- Footer Text & Badge -->
  <g text-anchor="middle" transform="translate(600, 118)">
    <text font-family="'Fira Code', monospace, sans-serif" font-weight="600" font-size="14.5px" fill="#E6EDF3" letter-spacing="1px">
      Building technology that solves real healthcare problems — one commit at a time. 🚀
    </text>
  </g>
</svg>
