<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 280" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#080C14" />
      <stop offset="45%" stop-color="#0D1527" />
      <stop offset="85%" stop-color="#091E3A" />
      <stop offset="100%" stop-color="#002D5A" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="cyanWave" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC" stop-opacity="0.2" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.6" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.3" />
    </linearGradient>

    <linearGradient id="glowGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#00F0FF" />
    </linearGradient>

    <!-- Filter for neon text glow -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    .title {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 800;
      font-size: 52px;
      fill: #FFFFFF;
      letter-spacing: -0.5px;
    }
    .subtitle {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Helvetica Neue', Arial, sans-serif;
      font-weight: 500;
      font-size: 21px;
      fill: #00D9FF;
      letter-spacing: 2px;
    }
    .tagline {
      font-family: 'Fira Code', monospace, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      font-size: 15px;
      fill: #8B949E;
    }
    .pulse-line {
      stroke-dasharray: 800;
      stroke-dashoffset: 800;
      animation: dash 4s ease-in-out infinite alternate;
    }
    @keyframes dash {
      from { stroke-dashoffset: 800; }
      to { stroke-dashoffset: 0; }
    }
  </style>

  <!-- Background Base -->
  <rect width="1200" height="280" rx="16" fill="url(#bgGrad)" />

  <!-- Subtle Grid Pattern -->
  <g opacity="0.08" stroke="#58A6FF" stroke-width="1">
    <line x1="0" y1="40" x2="1200" y2="40" />
    <line x1="0" y1="100" x2="1200" y2="100" />
    <line x1="0" y1="160" x2="1200" y2="160" />
    <line x1="0" y1="220" x2="1200" y2="220" />
    <line x1="200" y1="0" x2="200" y2="280" />
    <line x1="400" y1="0" x2="400" y2="280" />
    <line x1="600" y1="0" x2="600" y2="280" />
    <line x1="800" y1="0" x2="800" y2="280" />
    <line x1="1000" y1="0" x2="1000" y2="280" />
  </g>

  <!-- Glowing Mesh Waves -->
  <path d="M 0,220 Q 300,160 600,210 T 1200,180 L 1200,280 L 0,280 Z" fill="url(#cyanWave)" />
  <path d="M 0,240 Q 350,190 700,230 T 1200,210 L 1200,280 L 0,280 Z" fill="#00D9FF" fill-opacity="0.25" />

  <!-- MedTech ECG Pulse Wave Accent -->
  <path class="pulse-line" d="M 0,250 L 350,250 L 370,235 L 385,265 L 405,210 L 425,275 L 440,240 L 455,250 L 1200,250" 
        fill="none" stroke="#00D9FF" stroke-width="2.5" stroke-linecap="round" opacity="0.6" />

  <!-- Glowing Accent Orbs -->
  <circle cx="150" cy="70" r="100" fill="#0052CC" opacity="0.15" filter="url(#glow)" />
  <circle cx="1050" cy="100" r="130" fill="#00D9FF" opacity="0.12" filter="url(#glow)" />

  <!-- Header Content -->
  <g text-anchor="middle">
    <!-- Main Name -->
    <text x="600" y="105" class="title">Dmitry Alexandrovski</text>
    
    <!-- Subtitle / Role -->
    <text x="600" y="152" class="subtitle">CO-FOUNDER &amp; CTO  •  AI ENGINEER  •  CORTEXNEO</text>
    
    <!-- Focus Badges / Tags -->
    <text x="600" y="195" class="tagline">🏥 HealthTech &amp; Stroke CDS  |  🧠 3D Medical Imaging AI  |  ⚡ Distributed Full-Stack</text>
  </g>
</svg>
