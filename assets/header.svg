<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 380" width="100%" height="100%">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#050811" />
      <stop offset="30%" stop-color="#080F20" />
      <stop offset="70%" stop-color="#0A1835" />
      <stop offset="100%" stop-color="#020B1A" />
    </linearGradient>

    <!-- Glowing Text Gradient -->
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="40%" stop-color="#00F0FF" />
      <stop offset="80%" stop-color="#70A6FF" />
      <stop offset="100%" stop-color="#00D9FF" />
    </linearGradient>

    <!-- Subtitle Gradient -->
    <linearGradient id="subGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#00F0FF" />
      <stop offset="50%" stop-color="#58A6FF" />
      <stop offset="100%" stop-color="#A5D6FF" />
    </linearGradient>

    <!-- Wave Gradients -->
    <linearGradient id="wave1Grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0052CC" stop-opacity="0.35" />
      <stop offset="50%" stop-color="#00D9FF" stop-opacity="0.65" />
      <stop offset="100%" stop-color="#7928CA" stop-opacity="0.4" />
    </linearGradient>

    <linearGradient id="wave2Grad" x1="100%" y1="0%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#00D9FF" stop-opacity="0.2" />
      <stop offset="60%" stop-color="#0052CC" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.1" />
    </linearGradient>

    <!-- Glass Card Gradient -->
    <linearGradient id="cardGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#161B22" stop-opacity="0.8" />
      <stop offset="100%" stop-color="#0D1117" stop-opacity="0.6" />
    </linearGradient>

    <!-- Neon Glow Filters -->
    <filter id="neonGlow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="blur1" />
      <feGaussianBlur stdDeviation="15" result="blur2" />
      <feMerge>
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="4" result="blur" />
      <feMerge>
        <feMergeNode in="blur" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>
  </defs>

  <style>
    @keyframes pulse {
      0%, 100% { opacity: 0.3; transform: scale(1); }
      50% { opacity: 0.9; transform: scale(1.15); }
    }
    @keyframes ecgMove {
      0% { stroke-dashoffset: 2000; }
      100% { stroke-dashoffset: 0; }
    }
    @keyframes floatParticle {
      0%, 100% { transform: translateY(0px) translateX(0px); opacity: 0.4; }
      50% { transform: translateY(-12px) translateX(8px); opacity: 0.9; }
    }
    @keyframes scanline {
      0% { transform: translateY(-380px); }
      100% { transform: translateY(380px); }
    }
    @keyframes waveFlow {
      0%, 100% { transform: translateX(0px); }
      50% { transform: translateX(-30px); }
    }

    .title-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Outfit', sans-serif;
      font-weight: 900;
      font-size: 50px;
      fill: url(#textGrad);
      letter-spacing: -0.5px;
    }
    .badge-text {
      font-family: 'Fira Code', 'Consolas', monospace;
      font-weight: 600;
      font-size: 13px;
      letter-spacing: 1.5px;
    }
    .hud-text {
      font-family: 'Fira Code', monospace;
      font-size: 12px;
      fill: #58A6FF;
      letter-spacing: 1px;
    }
    .synapse {
      animation: floatParticle 5s ease-in-out infinite alternate;
    }
    .ecg-anim {
      stroke-dasharray: 2000;
      stroke-dashoffset: 2000;
      animation: ecgMove 6s linear infinite;
    }
  </style>

  <!-- Base Canvas Background -->
  <rect width="1200" height="380" rx="18" fill="url(#bgGrad)" stroke="#30363D" stroke-width="1.5" />

  <!-- Cyber Grid -->
  <g opacity="0.07" stroke="#00D9FF" stroke-width="1">
    <line x1="0" y1="50" x2="1200" y2="50" />
    <line x1="0" y1="120" x2="1200" y2="120" />
    <line x1="0" y1="190" x2="1200" y2="190" />
    <line x1="0" y1="260" x2="1200" y2="260" />
    <line x1="0" y1="330" x2="1200" y2="330" />
    <line x1="150" y1="0" x2="150" y2="380" />
    <line x1="350" y1="0" x2="350" y2="380" />
    <line x1="550" y1="0" x2="550" y2="380" />
    <line x1="750" y1="0" x2="750" y2="380" />
    <line x1="950" y1="0" x2="950" y2="380" />
    <line x1="1100" y1="0" x2="1100" y2="380" />
  </g>

  <!-- Ambient Glowing Nebulas -->
  <circle cx="180" cy="90" r="140" fill="#0052CC" opacity="0.22" filter="url(#neonGlow)" />
  <circle cx="1020" cy="110" r="160" fill="#00D9FF" opacity="0.18" filter="url(#neonGlow)" />
  <circle cx="600" cy="220" r="180" fill="#7928CA" opacity="0.12" filter="url(#neonGlow)" />

  <!-- Neural Mesh / Synaptic Constellations (Left Side) -->
  <g stroke="#00D9FF" stroke-width="1" opacity="0.35">
    <line x1="80" y1="70" x2="160" y2="110" />
    <line x1="160" y1="110" x2="110" y2="180" />
    <line x1="110" y1="180" x2="200" y2="210" />
    <line x1="160" y1="110" x2="250" y2="80" />
    <line x1="250" y1="80" x2="200" y2="210" />
    <line x1="80" y1="70" x2="50" y2="150" />
    <line x1="50" y1="150" x2="110" y2="180" />
  </g>
  <g fill="#00F0FF" filter="url(#softGlow)">
    <circle cx="80" cy="70" r="4" class="synapse" />
    <circle cx="160" cy="110" r="5" />
    <circle cx="110" cy="180" r="4.5" class="synapse" />
    <circle cx="200" cy="210" r="5" />
    <circle cx="250" cy="80" r="4" class="synapse" />
    <circle cx="50" cy="150" r="3.5" />
  </g>

  <!-- Neural Mesh / 3D CT Coordinate Constellation (Right Side) -->
  <g stroke="#58A6FF" stroke-width="1" opacity="0.35">
    <line x1="1120" y1="80" x2="1040" y2="130" />
    <line x1="1040" y1="130" x2="1090" y2="200" />
    <line x1="1090" y1="200" x2="990" y2="220" />
    <line x1="1040" y1="130" x2="960" y2="90" />
    <line x1="960" y1="90" x2="990" y2="220" />
    <line x1="1120" y1="80" x2="1150" y2="160" />
    <line x1="1150" y1="160" x2="1090" y2="200" />
  </g>
  <g fill="#00D9FF" filter="url(#softGlow)">
    <circle cx="1120" cy="80" r="4" class="synapse" />
    <circle cx="1040" cy="130" r="5" />
    <circle cx="1090" cy="200" r="4.5" />
    <circle cx="990" cy="220" r="5" class="synapse" />
    <circle cx="960" cy="90" r="4" />
    <circle cx="1150" cy="160" r="3.5" class="synapse" />
  </g>

  <!-- Cyber Flow Wave Layers at Bottom -->
  <path d="M 0,270 Q 300,210 600,260 T 1200,230 L 1200,380 L 0,380 Z" fill="url(#wave1Grad)" />
  <path d="M 0,300 Q 350,250 700,290 T 1200,270 L 1200,380 L 0,380 Z" fill="url(#wave2Grad)" />
  <path d="M 0,335 Q 400,290 800,325 T 1200,310 L 1200,380 L 0,380 Z" fill="#00D9FF" fill-opacity="0.18" />

  <!-- Animated MedTech ECG / Pulse Telemetry Scan Wave -->
  <path class="ecg-anim" 
        d="M 0,320 L 280,320 L 300,320 L 315,300 L 328,345 L 348,260 L 368,365 L 385,305 L 398,320 L 720,320 L 735,300 L 748,345 L 768,260 L 788,365 L 805,305 L 818,320 L 1200,320" 
        fill="none" stroke="#00F0FF" stroke-width="2.5" stroke-linecap="round" filter="url(#neonGlow)" />

  <!-- Center Content Container -->
  <g text-anchor="middle">
    
    <!-- Top System Status Pill -->
    <g transform="translate(600, 48)">
      <rect x="-170" y="-16" width="340" height="32" rx="16" fill="#161B22" fill-opacity="0.85" stroke="#00D9FF" stroke-width="1.2" filter="url(#softGlow)" />
      <circle cx="-145" cy="0" r="5" fill="#00F0FF">
        <animate attributeName="opacity" values="1;0.2;1" dur="2s" repeatCount="indefinite" />
      </circle>
      <text x="5" y="4.5" class="badge-text" fill="#00D9FF">CTO @ CORTEXNEO  •  AI ENGINEER</text>
    </g>

    <!-- Main Name -->
    <text x="600" y="125" class="title-text" filter="url(#softGlow)">Dmitry Alexandrovski</text>

    <!-- Subtitle / Mission Tagline -->
    <text x="600" y="168" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-weight="600" font-size="20px" fill="url(#subGrad)" letter-spacing="0.5px">
      Building AI for Real-World Healthcare &amp; Clinical Decision Systems
    </text>

    <!-- Futuristic Tech Tag Pills (3 Cards) -->
    <g transform="translate(600, 218)">
      
      <!-- Card 1: 3D CT & Stroke AI -->
      <g transform="translate(-320, 0)">
        <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#0D1117" fill-opacity="0.9" stroke="#0052CC" stroke-width="1.2" />
        <text x="0" y="5" font-family="'Fira Code', monospace" font-size="13px" font-weight="600" fill="#79C0FF">🧠 3D CT &amp; Stroke AI</text>
      </g>

      <!-- Card 2: CortexNeo Platform -->
      <g transform="translate(0, 0)">
        <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#0D1117" fill-opacity="0.9" stroke="#00D9FF" stroke-width="1.5" filter="url(#softGlow)" />
        <text x="0" y="5" font-family="'Fira Code', monospace" font-size="13px" font-weight="700" fill="#00F0FF">⚡ CortexNeo MedTech</text>
      </g>

      <!-- Card 3: Full Stack & MLOps -->
      <g transform="translate(320, 0)">
        <rect x="-140" y="-18" width="280" height="36" rx="8" fill="#0D1117" fill-opacity="0.9" stroke="#0052CC" stroke-width="1.2" />
        <text x="0" y="5" font-family="'Fira Code', monospace" font-size="13px" font-weight="600" fill="#79C0FF">🚀 Full-Stack &amp; Fast MLOps</text>
      </g>

    </g>

  </g>

  <!-- Corner Tech Accents -->
  <path d="M 20,40 L 20,20 L 40,20" stroke="#00D9FF" stroke-width="2" fill="none" />
  <path d="M 1180,40 L 1180,20 L 1160,20" stroke="#00D9FF" stroke-width="2" fill="none" />
  <path d="M 20,340 L 20,360 L 40,360" stroke="#00D9FF" stroke-width="2" fill="none" />
  <path d="M 1180,340 L 1180,360 L 1160,360" stroke="#00D9FF" stroke-width="2" fill="none" />

</svg>
